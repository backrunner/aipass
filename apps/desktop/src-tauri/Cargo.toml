[package]
name = "aipass-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "aipass_desktop_lib"
# This is a desktop-only library linked by main.rs. Exporting the entire Rust
# API as a DLL exceeds PE's 65,535-export limit in Windows debug builds.
crate-type = ["rlib"]

[[bin]]
name = "aipass-desktop"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
aipass-desktop-platform = { path = "../../../crates/aipass-desktop-platform" }
aipass-agent = { path = "../../../crates/aipass-agent" }
aipass-agent-protocol = { path = "../../../crates/aipass-agent-protocol" }
aipass-config-writers = { path = "../../../crates/aipass-config-writers" }
aipass-crypto = { path = "../../../crates/aipass-crypto" }
aipass-native-host = { path = "../../../crates/aipass-native-host" }
aipass-provider-registry = { path = "../../../crates/aipass-provider-registry" }
aipass-proxy = { path = "../../../crates/aipass-proxy" }
aipass-storage = { path = "../../../crates/aipass-storage" }
aipass-sync = { path = "../../../crates/aipass-sync" }
aipass-vault = { path = "../../../crates/aipass-vault" }
anyhow.workspace = true
arboard = { version = "3", default-features = false }
base64.workspace = true
directories.workspace = true
interprocess.workspace = true
log = "0.4"
minisign-verify = "0.2"
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2.11.2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
time.workspace = true
url = "2"
uuid.workspace = true
zip = "4"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tempfile.workspace = true
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-quartz-core", "NSColor", "NSView", "NSWindow"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer"] }
