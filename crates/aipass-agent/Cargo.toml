[package]
name = "aipass-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "aipass_agent"
path = "src/lib.rs"

[[bin]]
name = "aipass-agent"
path = "src/main.rs"

[dependencies]
aipass-agent-protocol = { path = "../aipass-agent-protocol" }
aipass-config-writers = { path = "../aipass-config-writers" }
aipass-crypto = { path = "../aipass-crypto" }
aipass-proxy-conversion = { path = "../aipass-proxy-conversion" }
aipass-proxy = { path = "../aipass-proxy" }
aipass-provider-registry = { path = "../aipass-provider-registry" }
aipass-storage = { path = "../aipass-storage" }
aipass-sync = { path = "../aipass-sync" }
aipass-vault = { path = "../aipass-vault" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
directories.workspace = true
interprocess.workspace = true
notify.workspace = true
reqwest = { workspace = true, features = ["cookies", "form", "query", "http2"] }
semver.workspace = true
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
sha2.workspace = true
sys-locale = "0.3"
time.workspace = true
toml = "1"
url = "2"
uuid.workspace = true
zeroize.workspace = true
tempfile.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.14"
if-addrs = "0.15"
rand_core.workspace = true
aes-gcm = "0.10"
rsa = "0.9"
aes = "0.8"
cbc = "0.1"
md5 = "0.8"
rusqlite.workspace = true
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"

[build-dependencies]
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Authorization", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "process", "system"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "objc2", "CGEventSource", "CGEventTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSNotification", "NSDistributedNotificationCenter", "NSOperation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFDate"] }
block2 = "0.6"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
