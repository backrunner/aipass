[package]
name = "gpui"
version = "0.2.2"
edition = "2024"
authors = [
    "Nathan Sobo <nathan@zed.dev>",
]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = true
license = "Apache-2.0"
homepage = "https://gpui.rs"
readme = "README.md"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = [
    "gui",
]
autobenches = false

[package.metadata.cargo-shear]
ignored = [
    "getrandom",
    "objc2",
    "objc2-metal",
]
ignored-paths = [
    "src/_ownership_and_data_flow.rs",
    "benches/focus_cleanup.rs",
]

[lints.rust.unexpected_cfgs]
level = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[features]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
test-support = [
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
    "dep:futures-concurrency",
    "dep:postage",
    "dep:web-time",
]
bench-support = [
    "profiler",
    "dep:criterion",
    "dep:bench_metrics",
]
bench = [
    "bench-support",
]
inspector = [
    "gpui_macros/inspector",
]
leak-detection = []
font-kit = []
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = [
    "dep:embed-resource",
]
profiler = [
    "dep:hdrhistogram",
]
stacker = [
    "dep:stacksafe",
]
hot-reload = [
    "dep:async-tungstenite",
    "dep:dioxus-cli-config",
    "dep:dioxus-devtools-types",
    "dep:smol",
    "dep:subsecond",
]

[lib]
path = "src/gpui.rs"

[dependencies]
num_cpus = "1.13"
parking = "2.0.0"
ttf-parser = "0.25"
seahash = "4.1"
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"

[dependencies.accesskit]
version = "0.24.0"
