# Modified by AIPass: resolve workspace inheritance and pin renderer dependencies.
[[bench]]
name = "layout_line"
harness = false

[package]
name = "gpui_wgpu"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_wgpu.rs"
doctest = false

[features]
default = []
bench-support = [ "gpui/bench-support", "dep:image",]
font-kit = [ "dep:font-kit",]
test-support = [ "gpui/test-support", "dep:image",]

[dependencies]
cosmic-text = "0.19.0"

[workspace]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[dependencies.gpui]
default-features = false
git = "https://github.com/sonorahq/gpui"
rev = "8ddac49c8b5a079149b33b4581e03f74e05237e0"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.bytemuck]
version = "1"

[dependencies.collections]
version = "0.1.0"
git = "https://github.com/sonorahq/gpui"
rev = "8ddac49c8b5a079149b33b4581e03f74e05237e0"

[dependencies.etagere]
version = "0.2"

[dependencies.itertools]
version = "0.14.0"

[dependencies.image]
version = "0.25.1"
default-features = false
features = [ "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp",]
optional = true

[dependencies.log]
version = "0.4"
default-features = false
features = [ "std",]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.profiling]
version = "1"

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.smallvec]
version = "1.6"
features = [ "union", "const_new",]

[dependencies.swash]
version = "0.2.6"

[dependencies.unicode-bidi]
version = "0.3.18"
default-features = false
features = [ "hardcoded-data",]

[dependencies.unicode-segmentation]
version = "1.10"

[dependencies.gpui_util]
git = "https://github.com/sonorahq/gpui"
rev = "8ddac49c8b5a079149b33b4581e03f74e05237e0"

[dependencies.web-time]
version = "1.1.0"

[dependencies.font-kit]
git = "https://github.com/zed-industries/font-kit"
rev = "94b0f28166665e8fd2f53ff6d268a14955c82269"
package = "zed-font-kit"
version = "0.14.1-zed"
default-features = false
optional = true

[dev-dependencies.criterion]
version = "0.8.2"
features = [ "html_reports",]

[dev-dependencies.gpui]
default-features = false
features = [ "bench-support",]
git = "https://github.com/sonorahq/gpui"
rev = "8ddac49c8b5a079149b33b4581e03f74e05237e0"

[dev-dependencies.image]
version = "0.25.1"
default-features = false
features = [ "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp",]

[dev-dependencies.naga]
git = "https://github.com/gfx-rs/wgpu"
rev = "3b3506ea31154edc04de64debda0e780cba2639c"
default-features = false
features = [ "wgsl-in",]

[lints.rust.unexpected_cfgs]
level = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\"))".dependencies.wgpu]
git = "https://github.com/gfx-rs/wgpu"
rev = "3b3506ea31154edc04de64debda0e780cba2639c"
default-features = false
features = [ "std", "metal", "gles", "vulkan", "wgsl", "webgpu",]

[target."cfg(not(any(target_os = \"linux\", target_os = \"freebsd\")))".dependencies.wgpu]
git = "https://github.com/gfx-rs/wgpu"
rev = "3b3506ea31154edc04de64debda0e780cba2639c"
default-features = true

[target."cfg(target_family = \"wasm\")".dependencies.web-sys]
version = "0.3"
features = [ "HtmlCanvasElement",]

[target."cfg(target_family = \"wasm\")".dependencies.wgpu]
git = "https://github.com/gfx-rs/wgpu"
rev = "3b3506ea31154edc04de64debda0e780cba2639c"
default-features = false
features = [ "webgl",]
