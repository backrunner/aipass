name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon gnome-keyring libsecret-tools libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Verify isolated Linux native credential stores
        run: dbus-run-session -- node scripts/verify-linux-keyring.mjs
      - run: cargo build --workspace
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify Linux startup without systemd
        run: node scripts/verify-linux-autostart.mjs target/debug

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify embedded Svelte control panel is reproducible
        run: git diff --exit-code -- apps/control-panel/embedded

  linux-desktop:
    name: Linux packaged runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 xdg-utils
          command -v xdg-mime
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable updater signing key
        run: node scripts/prepare-runtime-check-build.mjs "${RUNNER_TEMP}/aipass-linux-runtime-signing"
      - name: Build signed Linux test packages
        run: pnpm --dir apps/desktop tauri build --ci --bundles deb,appimage --config "${AIPASS_RUNTIME_BUILD_CONFIG}"
      - name: Verify packaged CLI, main window and tray startup
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' node scripts/verify-linux-runtime.mjs
      - name: Verify official Cursor Local API integration
        shell: bash
        run: |
          set -euo pipefail
          cursor_local_root="$(mktemp -d "${RUNNER_TEMP}/aipass-cursor-local.XXXXXX")"
          trap 'rm -rf "$cursor_local_root"' EXIT
          case "$(uname -m)" in
            x86_64) cursor_local_arch=x64 ;;
            aarch64|arm64) cursor_local_arch=arm64 ;;
            *) echo "Unsupported Cursor Local architecture" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 \
            "https://downloads.cursor.com/lab/2026.10.19-6bbf2c4/linux/${cursor_local_arch}/agent-cli-local-package.tar.gz" \
            | tar --strip-components=1 -xz -C "$cursor_local_root"
          mkdir -p linux-runtime-check-reports
          node scripts/verify-cursor-local.mjs "$cursor_local_root/cursor-agent-local" \
            | tee linux-runtime-check-reports/cursor-local.jsonl
      - name: Verify official Pi API integration
        shell: bash
        run: |
          set -euo pipefail
          pi_runtime_root="$(mktemp -d "${RUNNER_TEMP}/aipass-pi-runtime.XXXXXX")"
          trap 'rm -rf "$pi_runtime_root"' EXIT
          for pi_flavor in legacy current; do
            case "$pi_flavor" in
              legacy) pi_package=@mariozechner/pi-coding-agent@0.73.1 ;;
              current) pi_package=@earendil-works/pi-coding-agent@1.3.0 ;;
            esac
            npm install --prefix "$pi_runtime_root/$pi_flavor" --ignore-scripts --no-audit --no-fund "$pi_package"
            node scripts/verify-pi-local.mjs "$pi_runtime_root/$pi_flavor/node_modules/.bin/pi" \
              | tee -a linux-runtime-check-reports/pi-local.jsonl
          done
      - name: Verify signed AppImage installation and failure recovery
        run: |
          mapfile -t images < <(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage')
          test "${#images[@]}" -eq 1
          version="$(node -p "require('./apps/desktop/package.json').version")"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' node scripts/verify-linux-updater.mjs "${images[0]}" "$version"
      - name: Remove disposable signing key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/aipass-linux-runtime-signing"
      - name: Upload Linux runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-checks
          path: |
            linux-runtime-check-reports/
            linux-updater-check-reports/
          if-no-files-found: ignore
          retention-days: 14

  macos-desktop:
    name: macOS desktop bundle
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Verify desktop and macOS process lifecycle
        run: |
          cargo test -p aipass-desktop --lib
          cargo test -p aipass-agent autostart::
      - name: Verify isolated proxy uninstall recovery
        run: |
          cargo build -p aipass-agent -p aipass-cli
          node scripts/verify-proxy-uninstall.mjs target/debug
      - name: Prepare disposable updater signing key
        run: node scripts/prepare-runtime-check-build.mjs "${RUNNER_TEMP}/aipass-runtime-signing"
      - name: Build macOS test app and DMG with ad hoc signing
        env:
          # CI normally skips Finder's background and icon layout in Tauri.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: pnpm --dir apps/desktop tauri build --ci --bundles app,dmg --config "${AIPASS_RUNTIME_BUILD_CONFIG}"
      - name: Verify app bundle
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find target -path "*/release/bundle/macos/AIPass.app" -type d -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "::error::macOS app bundle was not produced."
            exit 1
          fi
          test -x "${app_path}/Contents/MacOS/aipass-desktop"
          test -x "${app_path}/Contents/Resources/aipass-agent"
          test -x "${app_path}/Contents/Resources/aipass-native-host"
      - name: Verify DMG integrity
        run: |
          node --test scripts/verify-macos-dmg.test.mjs
          node scripts/verify-macos-dmg.mjs target/release/bundle/dmg
      - name: Verify packaged startup and update restart
        run: node scripts/verify-macos-runtime.mjs target/release/bundle runtime-check-reports
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-runtime-checks
          path: runtime-check-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable signing key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/aipass-runtime-signing"

  windows:
    name: Windows workspace and installed runtime
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUST_TEST_THREADS: 4
      RUST_BACKTRACE: 1
      RUST_TEST_NOCAPTURE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify embedded Svelte control panel is reproducible
        run: git diff --exit-code -- apps/control-panel/embedded
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
        timeout-minutes: 20
      - run: cargo build --workspace
      - name: Verify unpackaged Windows CLI and Agent runtime
        run: node scripts/verify-cli-runtime.mjs target/debug windows-runtime-check-reports/cli-debug
      - name: Verify isolated proxy uninstall recovery
        run: node scripts/verify-proxy-uninstall.mjs target/debug
      - name: Prepare disposable updater signing key
        run: node scripts/prepare-runtime-check-build.mjs "${{ runner.temp }}/aipass-windows-runtime-signing"
      - name: Build Windows NSIS test installer
        run: pnpm --dir apps/desktop tauri build --ci --bundles nsis --config "$env:AIPASS_RUNTIME_BUILD_CONFIG"
      - name: Verify installed main, tray, CLI, Native Messaging and uninstall
        run: node scripts/verify-windows-runtime.mjs target/release/bundle/nsis
      - name: Remove disposable signing key
        if: always()
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "${{ runner.temp }}/aipass-windows-runtime-signing"
      - name: Upload Windows runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-checks
          path: windows-runtime-check-reports/
          if-no-files-found: ignore
          retention-days: 14
