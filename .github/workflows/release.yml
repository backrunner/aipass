name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed release tag, for example v1.2.3 or v1.2.3-beta.1"
        required: true
      channel:
        description: "Release channel (auto derives it from the tag version)"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - official
          - beta
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      build_number: ${{ steps.release.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release tag and versions
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          channel="${{ github.event.inputs.channel || 'auto' }}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use semantic versions, for example v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          if [[ "${channel}" == "auto" ]]; then
            if [[ "${version}" == *-* ]]; then
              channel="beta"
            else
              channel="official"
            fi
          fi

          if [[ "${channel}" == "official" && "${version}" == *-* ]]; then
            echo "::error::Official releases cannot use a prerelease version: ${version}."
            exit 1
          fi

          if [[ "${channel}" == "beta" && ! "${version}" =~ -beta([.]|$) ]]; then
            echo "::error::Beta releases must use a -beta prerelease version: ${version}."
            exit 1
          fi

          # Versions are stamped from the tag during the macOS build via
          # scripts/set-release-version.mjs, so the repository files only need
          # to agree with each other here.
          root_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(node -e "const fs = require('fs'); const text = fs.readFileSync('Cargo.toml', 'utf8'); const match = /\\[workspace\\.package\\][\\s\\S]*?^version\\s*=\\s*\"([^\"]+)\"/m.exec(text); console.log(match?.[1] ?? '')")"

          for pair in \
            "apps/desktop/package.json:${desktop_version}" \
            "apps/desktop/src-tauri/tauri.conf.json:${tauri_version}" \
            "Cargo.toml workspace.package:${cargo_version}"; do
            name="${pair%%:*}"
            found="${pair#*:}"
            if [[ "${found}" != "${root_version}" ]]; then
              echo "::error::${name} version ${found} does not match package.json version ${root_version}."
              exit 1
            fi
          done

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "build_number=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

  macos-desktop:
    name: macOS desktop
    needs: resolve-release
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ needs.resolve-release.outputs.version }}"

      - name: Validate signing and updater secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing ${name}. Configure the matching GitHub secret before publishing a macOS desktop release."
              exit 1
            fi
          done

          api_key_count=0
          password_count=0
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_BASE64; do
            [[ -z "${!name}" ]] || ((api_key_count += 1))
          done
          for name in APPLE_ID APPLE_PASSWORD; do
            [[ -z "${!name}" ]] || ((password_count += 1))
          done

          if (( api_key_count == 3 )); then
            echo "Using App Store Connect API key notarization"
          elif (( password_count == 2 )); then
            echo "Using Apple ID notarization"
          else
            (( api_key_count == 0 )) || echo "::error::APPLE_API_KEY_ID, APPLE_API_ISSUER, and APPLE_API_KEY_BASE64 must be configured together."
            (( password_count == 0 )) || echo "::error::APPLE_ID and APPLE_PASSWORD must be configured together."
            echo "::error::Configure either App Store Connect API key credentials or Apple ID credentials for notarization."
            exit 1
          fi

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}

      - name: Verify signing identity
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if ! security find-identity -v -p codesigning | grep -qF "${APPLE_SIGNING_IDENTITY}"; then
            echo "::error::Signing identity \"${APPLE_SIGNING_IDENTITY}\" not found after certificate import."
            security find-identity -v -p codesigning
            exit 1
          fi

      # tauri-bundler picks notarization credentials by env var presence and
      # tries the Apple ID trio first, so the credentials for the active mode
      # are exported via GITHUB_ENV and never set as empty variables.
      - name: Prepare notarization credentials
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -n "${APPLE_API_KEY_ID}" ]]; then
            api_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "${APPLE_API_KEY_BASE64}" | base64 -D > "${api_key_path}"
            chmod 600 "${api_key_path}"
            if ! grep -q 'BEGIN PRIVATE KEY' "${api_key_path}"; then
              echo "::error::APPLE_API_KEY_BASE64 is not a valid base64-encoded .p8 key."
              exit 1
            fi
            {
              echo "APPLE_API_KEY=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "APPLE_API_KEY_PATH=${api_key_path}"
            } >> "${GITHUB_ENV}"
          else
            {
              echo "APPLE_ID=${APPLE_ID}"
              echo "APPLE_PASSWORD=${APPLE_PASSWORD}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}"
            } >> "${GITHUB_ENV}"
          fi

      - name: Prepare Tauri release config
        env:
          AIPASS_DESKTOP_BUILD_NUMBER: ${{ needs.resolve-release.outputs.build_number }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: node scripts/prepare-tauri-macos-release-config.mjs

      - name: Build signed and notarized macOS desktop app
        env:
          CI: true
          AIPASS_MACOS_UNIVERSAL: true
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir apps/desktop tauri build --ci --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.generated.json

      - name: Verify macOS app signing and notarization
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          app_path="$(find target apps/desktop/src-tauri/target -path "*/universal-apple-darwin/release/bundle/*" -type d -name "AIPass.app" -print -quit 2>/dev/null || true)"

          if [[ -z "${app_path}" ]]; then
            echo "::error::Missing universal AIPass.app bundle."
            find target apps/desktop/src-tauri/target -maxdepth 6 -path "*/release/bundle/*" -print 2>/dev/null || true
            exit 1
          fi

          signed_team="$(codesign -dv --verbose=4 "${app_path}" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ "${signed_team}" != "${APPLE_TEAM_ID}" ]]; then
            echo "::error::AIPass.app signature TeamIdentifier ${signed_team} does not match APPLE_TEAM_ID."
            exit 1
          fi

          lipo target/release/aipass-agent -verify_arch arm64 x86_64
          lipo target/release/aipass-native-host -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"
          xcrun stapler validate "${app_path}"

      - name: Notarize and validate DMG
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$(find target apps/desktop/src-tauri/target -path "*/universal-apple-darwin/release/bundle/*" -type f -name "*.dmg" -print -quit 2>/dev/null || true)"

          if [[ -z "${dmg_path}" ]]; then
            echo "::error::Missing universal DMG bundle."
            find target apps/desktop/src-tauri/target -maxdepth 6 -path "*/release/bundle/*" -print 2>/dev/null || true
            exit 1
          fi

          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            notary_credentials=(
              --key "${APPLE_API_KEY_PATH}"
              --key-id "${APPLE_API_KEY}"
              --issuer "${APPLE_API_ISSUER}"
            )
          else
            notary_credentials=(
              --apple-id "${APPLE_ID}"
              --password "${APPLE_PASSWORD}"
              --team-id "${APPLE_TEAM_ID}"
            )
          fi

          xcrun notarytool submit "${dmg_path}" "${notary_credentials[@]}" --wait --timeout 30m
          xcrun stapler staple "${dmg_path}"

          codesign --verify --verbose=4 "${dmg_path}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg_path}"
          xcrun stapler validate "${dmg_path}"

      - name: Prepare release artifacts
        env:
          AIPASS_RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          AIPASS_RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
          AIPASS_REQUIRE_UNIVERSAL: true
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/prepare-macos-release-artifacts.mjs release-artifacts

      - name: Verify updater archive
        shell: bash
        run: |
          set -euo pipefail

          archive_path="$(find release-artifacts -maxdepth 1 -type f -name "*.app.tar.gz" -print -quit)"
          if [[ -z "${archive_path}" ]]; then
            echo "::error::Missing macOS updater archive."
            exit 1
          fi

          extract_dir="$(mktemp -d "${RUNNER_TEMP}/aipass-updater.XXXXXX")"
          trap 'rm -rf "${extract_dir}"' EXIT
          tar -xzf "${archive_path}" -C "${extract_dir}"
          updater_app="$(find "${extract_dir}" -type d -name "AIPass.app" -print -quit)"
          if [[ -z "${updater_app}" ]]; then
            echo "::error::Updater archive does not contain AIPass.app."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${updater_app}"
          spctl --assess --type execute --verbose=4 "${updater_app}"
          xcrun stapler validate "${updater_app}"

      - uses: actions/upload-artifact@v4
        with:
          name: aipass-desktop-macos-${{ needs.resolve-release.outputs.tag }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          find "${RUNNER_TEMP}" -maxdepth 1 -type f -name 'AuthKey_*.p8' -delete

  cli:
    name: CLI ${{ matrix.name }}
    needs: resolve-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            archive: aipass-cli-macos.tar.gz
          - os: ubuntu-22.04
            name: linux
            archive: aipass-cli-linux.tar.gz
          - os: windows-latest
            name: windows
            archive: aipass-cli-windows.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release -p aipass-cli -p aipass-native-host

      - name: Package CLI artifacts
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage
          cp target/release/aipass artifacts/stage/
          cp target/release/aipass-native-host artifacts/stage/
          cp LICENSE NOTICE README.md artifacts/stage/
          tar -czf "artifacts/${{ matrix.archive }}" -C artifacts/stage .

      - name: Package CLI artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/stage | Out-Null
          Copy-Item target/release/aipass.exe artifacts/stage/
          Copy-Item target/release/aipass-native-host.exe artifacts/stage/
          Copy-Item LICENSE, NOTICE, README.md artifacts/stage/
          Compress-Archive -Path artifacts/stage/* -DestinationPath "artifacts/${{ matrix.archive }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: aipass-cli-${{ matrix.name }}
          path: artifacts/${{ matrix.archive }}
          if-no-files-found: error

  extension:
    name: Chrome extension
    needs: resolve-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @aipass/extension... build

      - name: Package Chrome Web Store zip
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd apps/extension/dist
          zip -r ../../../artifacts/aipass-chrome-extension.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: aipass-chrome-extension
          path: artifacts/aipass-chrome-extension.zip
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs:
      - resolve-release
      - macos-desktop
      - cli
      - extension
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums and SBOM
        run: node scripts/release-metadata.mjs release-artifacts

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::${RELEASE_TAG} is already published; refusing to overwrite it."
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --draft \
              --verify-tag \
              --title "AIPass ${RELEASE_TAG}" \
              --notes "Signed and notarized macOS desktop artifacts, updater manifest, CLI archives, and extension package. The publish step rewrites latest.json to point at this release and publishes it on the ${{ needs.resolve-release.outputs.channel }} channel."
          fi

      - name: Validate updater manifest and publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          CHANNEL: ${{ needs.resolve-release.outputs.channel }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            // Draft releases do not resolve through releases/tags/{tag} (the
            // endpoint 404s until the release is published), so list releases
            // and match tag_name; retry briefly to ride out replica lag.
            let release;
            for (let attempt = 0; attempt < 5; attempt += 1) {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              release = releases.find((entry) => entry.tag_name === tag);
              if (release) break;
              if (attempt === 4) {
                core.setFailed(`No release found for ${tag}`);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (!release.draft) {
              core.setFailed(`${tag} is already published`);
              return;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });
            const assetsByName = new Map(assets.map((asset) => [asset.name, asset]));

            const updaterAsset = assetsByName.get('latest.json');
            if (!updaterAsset) {
              core.setFailed('latest.json was not uploaded');
              return;
            }

            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: updaterAsset.id,
                headers: { accept: 'application/octet-stream' },
              },
            );
            const manifest = JSON.parse(Buffer.from(response.data).toString('utf8'));
            const downloadBase = [
              'https://github.com',
              context.repo.owner,
              context.repo.repo,
              'releases/download',
              tag,
            ].join('/');

            for (const [platform, entry] of Object.entries(manifest.platforms ?? {})) {
              const fileName = entry.url ? decodeURIComponent(entry.url.split('/').pop()) : '';
              const asset = assetsByName.get(fileName);
              if (!asset) {
                core.setFailed(`Updater platform ${platform} references missing asset ${fileName}`);
                return;
              }
              entry.url = `${downloadBase}/${encodeURIComponent(asset.name)}`;
            }

            const requiredPlatforms = [
              'darwin-aarch64',
              'darwin-x86_64',
            ];
            const missing = requiredPlatforms.filter((platform) => {
              const entry = manifest.platforms?.[platform];
              return !entry?.url?.startsWith(`${downloadBase}/`) || !entry?.signature;
            });

            if (manifest.version !== process.env.VERSION || missing.length > 0) {
              core.setFailed(
                `Invalid latest.json: version=${manifest.version}, missing=${missing.join(', ') || 'none'}`,
              );
              return;
            }

            const manifestData = Buffer.from(JSON.stringify(manifest, null, 2) + '\n');
            await github.rest.repos.deleteReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: updaterAsset.id,
            });
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'latest.json',
              data: manifestData,
              headers: {
                'content-type': 'application/json',
                'content-length': manifestData.length,
              },
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              prerelease: process.env.CHANNEL === 'beta',
              make_latest: process.env.CHANNEL === 'beta' ? 'false' : 'true',
            });

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let betaFeed = releases.find((entry) => entry.tag_name === 'beta');
            if (!betaFeed) {
              betaFeed = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'beta',
                target_commitish: context.sha,
                name: 'AIPass Beta Channel',
                body: 'Rolling update manifest for AIPass Beta clients.',
                draft: false,
                prerelease: true,
                make_latest: 'false',
              })).data;
            } else {
              betaFeed = (await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: betaFeed.id,
                name: 'AIPass Beta Channel',
                body: 'Rolling update manifest for AIPass Beta clients.',
                draft: false,
                prerelease: true,
                make_latest: 'false',
              })).data;
            }

            const betaAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: betaFeed.id,
              per_page: 100,
            });
            const currentManifestAsset = betaAssets.find((asset) => asset.name === 'latest.json');

            const parseSemver = (value) => {
              const [withoutBuild] = value.split('+');
              const separator = withoutBuild.indexOf('-');
              const core = (separator === -1 ? withoutBuild : withoutBuild.slice(0, separator))
                .split('.')
                .map(Number);
              const prerelease = separator === -1
                ? null
                : withoutBuild.slice(separator + 1).split('.');
              return { core, prerelease };
            };
            const compareSemver = (left, right) => {
              const a = parseSemver(left);
              const b = parseSemver(right);
              for (let index = 0; index < 3; index += 1) {
                if (a.core[index] !== b.core[index]) return a.core[index] - b.core[index];
              }
              if (a.prerelease === null) return b.prerelease === null ? 0 : 1;
              if (b.prerelease === null) return -1;
              const length = Math.max(a.prerelease.length, b.prerelease.length);
              for (let index = 0; index < length; index += 1) {
                const aPart = a.prerelease[index];
                const bPart = b.prerelease[index];
                if (aPart === undefined) return -1;
                if (bPart === undefined) return 1;
                if (aPart === bPart) continue;
                const aNumeric = /^[0-9]+$/.test(aPart);
                const bNumeric = /^[0-9]+$/.test(bPart);
                if (aNumeric && bNumeric) return Number(aPart) - Number(bPart);
                if (aNumeric !== bNumeric) return aNumeric ? -1 : 1;
                return aPart.localeCompare(bPart);
              }
              return 0;
            };

            if (currentManifestAsset) {
              const currentResponse = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: currentManifestAsset.id,
                  headers: { accept: 'application/octet-stream' },
                },
              );
              const currentManifest = JSON.parse(
                Buffer.from(currentResponse.data).toString('utf8'),
              );
              if (compareSemver(manifest.version, currentManifest.version) < 0) {
                core.info(
                  `Keeping newer beta feed ${currentManifest.version}; published ${manifest.version}`,
                );
                return;
              }
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: currentManifestAsset.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: betaFeed.id,
              name: 'latest.json',
              data: manifestData,
              headers: {
                'content-type': 'application/json',
                'content-length': manifestData.length,
              },
            });
